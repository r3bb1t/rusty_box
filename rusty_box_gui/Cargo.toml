[package]
name = "rusty_box_gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rusty Box emulator runner with typed CLI flags and TOML configuration"
readme = "README.md"
keywords = ["x86", "emulator", "bochs", "cli"]
categories = ["emulators", "command-line-utilities"]

[lib]
name = "rusty_box_gui"
path = "src/lib.rs"

[[bin]]
name = "rusty_box_gui"
path = "src/main.rs"

[features]
default = ["gui-egui"]
gui-egui = ["rusty_box/gui-egui", "dep:egui", "dep:eframe"]

[dependencies]
rusty_box_bximage = { path = "../rusty_box_bximage" }
clap.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
egui = { workspace = true, optional = true }
eframe = { workspace = true, optional = true, features = ["default_fonts", "glow"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusty_box = { path = "../rusty_box", default-features = false, features = ["std"] }
rfd = "0.17.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusty_box = { path = "../rusty_box", default-features = false, features = ["alloc", "instrumentation"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
log = "0.4"
web-time = "1"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "HtmlInputElement", "HtmlAnchorElement", "Element", "Event", "FileReader", "FileList", "File", "Blob", "Url"] }
