[package]
name = "rusty_box_gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rusty Box emulator runner with typed CLI flags and TOML configuration"
readme = "README.md"
keywords = ["x86", "emulator", "bochs", "cli"]
categories = ["emulators", "command-line-utilities"]

[lib]
name = "rusty_box_gui"
path = "src/lib.rs"

[[bin]]
name = "rusty_box_gui"
path = "src/main.rs"

[features]
default = ["gui-egui", "hv-whp"]
gui-egui = ["rusty_box/gui-egui", "dep:egui", "dep:eframe"]
windows-gui-subsystem = []
# Diagnostic build: hook the CPU and record guest process starts/exits,
# stderr writes, mounts, signals, and CPU exceptions to guest_trace.log.
# Costs emulation speed; single-CPU configs only. See src/guest_trace.rs.
# The tracer is a plain `Instrumentation` impl, so it needs no feature of
# rusty_box: an observer is a type, not a registered closure.
guest-trace = []
# Run the guest on the Windows Hypervisor Platform instead of the interpreter,
# chosen with `--engine whp` or from the window's Processors panel.
#
# On by default so the choice is offered without a rebuild. It costs the other
# targets nothing: the dependency it names is declared only under
# `cfg(windows)`, so enabling the feature elsewhere resolves to nothing, and
# every use of it is additionally gated on `windows`.
hv-whp = ["dep:rusty_box_whp_engine"]
# Android: bake `assets/alpine.iso` into the APK as the CD a phone boots at its
# first power-on. Off by default, so no other build needs the ISO; `cargo xtask
# android build` copies the ISO into place and turns this on.
embedded-alpine = []

[dependencies]
rusty_box_bximage = { path = "../rusty_box_bximage" }
clap.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
egui = { workspace = true, optional = true }
eframe = { workspace = true, optional = true, features = ["default_fonts", "glow"] }

# The egui inspection protocol, which egui_mcp drives the shell through, rides
# on accesskit, and eframe offers accesskit on Android only with GameActivity.
# The APK runs under NativeActivity, so its build leaves inspection out.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { workspace = true, optional = true, features = ["inspection"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusty_box = { path = "../rusty_box", default-features = false, features = ["std"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
rfd = "0.17.2"

# The Android front end (src/android.rs): NativeActivity through winit — the
# version eframe drives, named for its `AndroidApp` — logcat, and JNI for the
# storage permission the file browser needs. `persistence` is the hook for
# the app going to the background: with a storage to save to, eframe calls
# `App::save` when the activity's window is taken away, and the shell writes
# its edits then (src/runner.rs, `run_android_shell`). Nothing is stored
# through it.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, optional = true, features = ["android-native-activity", "persistence"] }
winit = "0.30.13"
android_logger = "0.15"
log = "0.4"
jni = "0.22.4"

# The hypervisor engine is a Windows leaf. Optional and target-gated so the
# other platforms' builds never resolve it.
[target.'cfg(windows)'.dependencies]
rusty_box_whp_engine = { path = "../rusty_box_whp_engine", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusty_box = { path = "../rusty_box", default-features = false, features = ["alloc"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
log = "0.4"
web-time = "1"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "HtmlInputElement", "HtmlAnchorElement", "Element", "Event", "FileReader", "FileList", "File", "Blob", "Url"] }

# The APK's native library. NativeActivity loads it and calls its
# `android_main`; `cargo xtask android build` packages it with cargo-apk, which
# reads the `package.metadata.android` tables below.
[[example]]
name = "rusty_box_gui_android"
path = "examples/android.rs"
crate-type = ["cdylib"]
required-features = ["gui-egui"]

[package.metadata.android]
package = "com.rustybox.android"
apk_name = "RustyBoxAndroid"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 34

# Shared storage, for the file browser (src/android.rs). Up to Android 10 the
# browser asks for READ and WRITE at runtime; from Android 11 it asks for "All
# files access" (MANAGE_EXTERNAL_STORAGE) instead, so READ and WRITE end at 29.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 29
[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.application]
label = "Rusty Box"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout"
orientation = "landscape"
