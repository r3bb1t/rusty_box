[package]
name = "rusty_box_gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rusty Box emulator runner with typed CLI flags and TOML configuration"
readme = "README.md"
keywords = ["x86", "emulator", "bochs", "cli"]
categories = ["emulators", "command-line-utilities"]

[lib]
name = "rusty_box_gui"
path = "src/lib.rs"

[[bin]]
name = "rusty_box_gui"
path = "src/main.rs"

[features]
default = []
gui-egui = ["rusty_box/gui-egui"]

[dependencies]
rusty_box = { path = "../rusty_box", default-features = false, features = ["std"] }
clap.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
