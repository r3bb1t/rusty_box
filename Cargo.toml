[workspace]
members = ["rusty_box_core", "rusty_box_devices", "rusty_box_whp_sys", "rusty_box_whp", "rusty_box_whp_engine", "rusty_box", "rusty_box_decoder", "rusty_box_gui", "rusty_box_bximage", "xtask", "examples/rusty_box_web", "examples/rusty_box_uefi", "examples/no_alloc_smoke"]
default-members = ["rusty_box"]
resolver = "2"

[workspace.package]
version = "0.0.3"
edition = "2021"
license = "LGPL-2.1-or-later"
authors = ["Aslan Gurtsiev", "The Bochs Project (original C++ implementation)"]
repository = "https://github.com/r3bb1t/rusty_box"
homepage = "https://github.com/r3bb1t/rusty_box"

[workspace.dependencies]
rusty_box_core = { path = "rusty_box_core", version = "0.0.3" }
rusty_box_devices = { path = "rusty_box_devices", version = "0.0.3" }
tracing = { version = "0.1", default-features = false, features = ["max_level_trace", "release_max_level_info"] }
thiserror = { version = "2", default-features = false }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
byteorder = { version = "1.5", default-features = false }
bitflags = "2"
paste = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
egui = "0.35"
eframe = { version = "0.35", default-features = false, features = ["x11", "wayland", "glow"] }

# The default for a library crate here is proof-carrying. A crate opts in with
# `[lints] workspace = true`; the ones that cannot yet (rusty_box, at 103 unsafe
# tokens under a decreasing ratchet) simply do not, and P8 is where the last of
# them joins. Host FFI will live only in named leaf crates, which opt out by
# name with a `// UNSAFETY:` note and a ratchet baseline of their own.
[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
panic = "abort"