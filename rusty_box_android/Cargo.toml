[package]
name = "rusty_box_android"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Pure Rust Android APK frontend for Rusty Box"
readme = "README.md"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
embedded-alpine = []

[dependencies]
rusty_box = { path = "../rusty_box", default-features = false, features = ["std", "gui-egui"] }
rusty_box_gui = { path = "../rusty_box_gui", default-features = true }
eframe = { version = "=0.34.0", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
winit = "0.30.13"
android_logger = "0.15"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[package.metadata.android]
package = "com.rustybox.android"
apk_name = "RustyBoxAndroid"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.application]
label = "Rusty Box"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout"
orientation = "landscape"
