[env]
# RUST_BACKTRACE="1"
# BIOS_OUTPUT_FILE="bios_out.txt"
# BIOS_QUIET_MODE="1"
# RUSTY_BOX_HEADLESS="1"

MAX_INSTRUCTIONS="20000000000"

# libtest gives each test its own thread, whose default stack is 2 MiB. A
# TestMachine is ~1.4 MiB (DeviceManager 788 KiB + BxDevicesC 332 KiB + BxMemC
# 268 KiB), so a test that builds one per loop iteration overflows. Raising the
# floor here fixes it in one place instead of wrapping ~100 call sites in
# hand-rolled 64 MiB threads.
RUST_MIN_STACK="16777216"

# Boot profile: "dlx", "alpine" (BIOS/ISOLINUX), "alpine-direct" (direct kernel boot)
# Leave commented for auto-detect (BIOS boot when Alpine ISO found)
# RUSTY_BOX_BOOT="alpine-direct"
# ALPINE_ISO="alpine-virt-3.23.3-x86_64.iso"
# ALPINE_RAM_MB="128"
# CMDLINE="console=ttyS0,115200 earlyprintk=serial,ttyS0,115200 nomodeset"



[alias]
xtask = "run --package xtask --"
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-args=-z stack-size=8388608"]