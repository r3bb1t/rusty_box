[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Repository automation tasks for Rusty Box"
readme = "README.md"

[dependencies]
adb_client = { version = "3.2.2", default-features = false }
# The host's certificate store, so that a proxy the host trusts is trusted.
ureq = { version = "2", features = ["native-certs"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# The hook's input is a JSON event (Claude Code PreToolUse).
serde_json = "1"
# The shape check parses Rust source; span locations give it line numbers.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# `nested-kvm` checks what it downloads as Alpine's own tools do: the ISO's
# SHA-512, each repository index's RSA PKCS#1 v1.5 SHA-1 signature, each
# package's `Q1` SHA-1 checksum (base64); it reads gzip and tar itself.
sha2 = "0.10"
sha1 = { version = "0.10", features = ["oid"] }
rsa = "0.9"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
