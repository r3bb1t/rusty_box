[package]
name = "rusty_box_aarch64"
description = "AArch64 (ARMv8.0-A) interpreter and a QEMU-virt-compatible board: deterministic, no_std and allocation-free"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
rusty_box_core = { workspace = true }

[dev-dependencies]
# Tests save snapshots into a `Vec<u8>`, which is a snapshot sink with `alloc`.
rusty_box_core = { workspace = true, features = ["alloc"] }
# An independent A64 decoder, generated from binutils' opcode table: the
# reference the encoding list is proven equivalent to (src/cpu/decode.rs) and
# measured against (tests/encoding_coverage.rs), and the disassembler for the
# Unicorn replay's failure messages. Never a dependency of the library.
disarm64 = { version = "0.2", default-features = false, features = ["full"] }
disarm64_defn = { version = "0.2", default-features = false }

[features]
default = []
# Additive, as in rusty_box_core: neither changes the shape of the core.
alloc = ["rusty_box_core/alloc"]
std = ["alloc", "rusty_box_core/std"]

[lints]
workspace = true

[[example]]
name = "uefi_virt"
required-features = ["std"]

[[example]]
name = "linux_virt"
required-features = ["std"]
