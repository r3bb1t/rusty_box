[package]
name = "rusty_box_aarch64"
description = "AArch64 (ARMv8.0-A) interpreter and a QEMU-virt-compatible board: deterministic, no_std and allocation-free"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
rusty_box_core = { workspace = true }
# The display vocabulary (`DisplaySink`, `Resolution`) the virtio-gpu device
# shows its frames through, shared with the x86 machine's display cards.
rusty_box_devices = { workspace = true }

[dev-dependencies]
# Tests save snapshots into a `Vec<u8>`, which is a snapshot sink with `alloc`.
rusty_box_core = { workspace = true, features = ["alloc"] }
# An independent A64 decoder, generated from binutils' opcode table: what
# every encoding of an advertised feature is checked to execute against
# (tests/encoding_coverage.rs), what every word the decoder accepts that it
# does not allocate is checked to be UNDEFINED against (tests/unit/difftest.rs),
# and the disassembler for the Unicorn replay's failure messages. Never a
# dependency of the library.
disarm64 = { version = "0.2", default-features = false, features = ["full"] }
disarm64_defn = { version = "0.2", default-features = false }
# Read the decoder's own source (syn) and Arm's machine-readable specification
# (serde_json) for the conformance tests in tests/unit/spec.rs.
syn = { version = "2", default-features = false, features = ["full", "parsing"] }
serde_json = "1"

[features]
default = []
# Additive, as in rusty_box_core: neither changes the shape of the core.
alloc = ["rusty_box_core/alloc"]
std = ["alloc", "rusty_box_core/std"]

[lints]
workspace = true

[[example]]
name = "uefi_virt"
required-features = ["std"]

[[example]]
name = "linux_virt"
required-features = ["std"]
